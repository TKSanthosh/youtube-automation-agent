name: Autonomous YouTube Automation Pipeline (End-to-End Cloud)

on:
  # Schedule: Runs 4 times daily at global peak viewer engagement hours
  schedule:
    - cron: '0 2,8,14,20 * * *'

  # Manual Trigger: 1-click execution from GitHub website or GitHub mobile app
  workflow_dispatch:
    inputs:
      video_count:
        description: 'Number of videos to generate & upload (1 to 5)'
        required: true
        default: '1'
      format:
        description: 'Video Format / Length (Enforced YouTube Shorts/Reels 2:30-3:00 min)'
        required: true
        type: choice
        default: 'short'
        options:
          - 'short'
      topic:
        description: 'Specific topic (leave empty for 100% AI real-time trend discovery)'
        required: false
        default: ''
      skip_trend_scout:
        description: 'Skip live trend discovery (use existing suggestions queue)'
        type: boolean
        required: false
        default: false

concurrency:
  group: youtube-autonomous-pipeline
  cancel-in-progress: false

jobs:
  autonomous-production-and-publish:
    name: Trend Scout ➔ Create ➔ Upload ➔ Evolve Quality ➔ Sync State
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      actions: write
      issues: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      # ── Phase 1: Real-Time Tech Trend Scout & AI Blueprint Formulation ──
      - name: Scout Real-Time Tech Trends & Channel Analytics
        if: ${{ inputs.skip_trend_scout != true && inputs.topic == '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          NODE_ENV: "production"
        run: |
          echo "🔍 Scouting real-time YouTube search autocomplete & developer trend velocity..."
          node scripts/run-intelligence-agent.js || echo "Notice: Trend scout completed with fallback."

      # ── Phase 2: Video Production, Continuous Quality Evolution & YouTube Upload ──
      - name: Produce Video, Enforce Quality Evolution & Upload to YouTube
        env:
          # AI & Speech Synthesis
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # YouTube Data API Credentials
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DEFAULT_PRIVACY_STATUS: ${{ secrets.DEFAULT_PRIVACY_STATUS || 'public' }}
          
          # Video Engine Settings
          VIDEO_PROVIDER: "slideshow"
          VIDEO_RESOLUTION: "1080p"
          NODE_ENV: "production"
        run: |
          COUNT="${{ inputs.video_count || '1' }}"
          TOPIC="${{ inputs.topic || '' }}"
          
          CMD="node scripts/run-pipeline.js --count=$COUNT --length=short"
          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic=\"$TOPIC\""
          fi
          
          echo "🎬 Running Production Command: $CMD"
          eval $CMD

      # ── Phase 3: Commit Evolutionary State & Suggestions Back to Repository ──
      - name: Commit & Push Quality Evolution State & Suggestions Back to Repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage persistent JSON states
          git add data/quality-evolution-directives.json \
                  data/latest-suggestion.json \
                  data/ai-content-suggestions.json \
                  data/trend-insights.json || true
          
          if git diff --staged --quiet; then
            echo "No state updates to commit."
          else
            git commit -m "chore(ai): evolve video quality directives & update suggestions [skip ci]"
            git pull --rebase origin master || true
            git push origin HEAD:master || echo "Push notice: Branch protected or no changes."
          fi

      # ── Phase 4: Upload Run Artifacts for Audit ──
      - name: Upload Run Logs & Quality Directives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_number }}
          path: |
            data/quality-evolution-directives.json
            data/latest-suggestion.json
            data/ai-content-suggestions.json
            logs/
          retention-days: 14
