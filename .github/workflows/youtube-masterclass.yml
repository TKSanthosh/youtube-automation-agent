name: Weekly IT Masterclass Automation

on:
  # Manual Trigger Only (automated schedule disabled as requested by operator)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Course Topic (e.g., Master Docker, Master Java, Master Computer Science, Master Kubernetes, Master System Design, or leave empty for auto-curriculum)'
        required: false
        default: ''
      chapters:
        description: 'Number of chapters (leave empty for all 8 chapters, or e.g. 2 for quick validation)'
        required: false
        default: ''

concurrency:
  group: youtube-masterclass
  cancel-in-progress: false

jobs:
  produce-and-publish-masterclass:
    name: Create, Upload & Purge Weekly Masterclass
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Masterclass Pipeline (16:9 1080p, Timestamps, Upload & Purge)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DEFAULT_PRIVACY_STATUS: ${{ secrets.DEFAULT_PRIVACY_STATUS || 'public' }}
          NODE_ENV: "production"
        run: |
          TOPIC="${{ inputs.topic || '' }}"
          CHAPTERS="${{ inputs.chapters || '' }}"
          CMD="node scripts/run-masterclass.js"
          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic=\"$TOPIC\""
          fi
          if [ -n "$CHAPTERS" ]; then
            CMD="$CMD --chapters=$CHAPTERS"
          fi
          eval $CMD
