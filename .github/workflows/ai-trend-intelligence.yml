name: AI Trend & Engagement Intelligence Agent

on:
  # Run 4 times daily (every 6 hours) at peak global viewer engagement windows
  schedule:
    - cron: '0 0,6,12,18 * * *'

  # Manual on-demand execution via GitHub UI, mobile app, or API
  workflow_dispatch:
    inputs:
      trigger_video_workflow:
        description: 'Immediately trigger video generation pipeline with top suggestion?'
        type: boolean
        required: false
        default: false
      webhook_url:
        description: 'Optional Webhook endpoint to push suggestions directly'
        type: string
        required: false
        default: ''

concurrency:
  group: ai-trend-intelligence
  cancel-in-progress: false

jobs:
  analyze-and-recommend:
    name: Trend Scout, Engagement Analyzer & Suggestion Engine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write
      actions: write
      issues: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Intelligence Agent (Trend Scout + AI Video Blueprint Generator)
        id: intelligence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          WEBHOOK_URL: ${{ inputs.webhook_url || secrets.WEBHOOK_URL }}
          NODE_ENV: "production"
        run: |
          node scripts/run-intelligence-agent.js

      - name: Upload AI Trend & Suggestion Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-trend-insights-${{ github.run_number }}
          path: |
            data/ai-content-suggestions.json
            data/trend-insights.json
            data/latest-suggestion.json
          retention-days: 30

      - name: Commit & Push Updated Recommendations to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add updated JSON data feeds
          git add data/ai-content-suggestions.json data/trend-insights.json data/latest-suggestion.json
          
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping git commit."
          else
            git commit -m "chore(ai): update trend insights & content blueprints [skip ci]"
            git pull --rebase origin master || true
            git push origin HEAD:master || echo "Push skipped or branch protected."
          fi

      - name: Trigger Video Generation Pipeline (If Requested or Scheduled)
        if: ${{ inputs.trigger_video_workflow == true && steps.intelligence.outputs.HAS_SUGGESTION == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ steps.intelligence.outputs.TOPIC }}
        run: |
          echo "Triggering Daily Video Pipeline with AI Top Topic: $TOPIC"
          gh workflow run youtube-daily.yml -f topic="$TOPIC" || echo "Workflow trigger notice: Check permissions if disabled"
